name: Release SwiftSurf

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish DMG
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build DMG
        run: ./scripts/package-dmg.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="build-${GITHUB_SHA::7}"
          fi

          gh release create "$tag" \
            dist/SwiftSurf.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --title "SwiftSurf ${tag#v}" \
            --generate-notes \
            --latest
